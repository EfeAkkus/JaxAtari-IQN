# SimBa-SAC: the tuned SAC training hyperparameters combined with the SimBa
# residual network architecture. This configuration reuses hyperparameters tuned
# for the SAC baseline (reference sac_rgb_tuned.yaml, MertUyar/jaxtari_model_free);
# SimBa-specific architecture parameters were not independently tuned. The inline
# notes below are the reference author's observations for the baseline SAC networks.
ALG: SIMBA_SAC
EXP_NAME: simba_sac

PIXEL_BASED: True
NATIVE_DOWNSCALING: True

LEARNING_RATE: 0.0003
GAMMA: 0.99
TAU: 1.0
BATCH_SIZE: 64 # increasing it breaks the learning, making it tank the average return to 20. 64 seems to be the best value.
BUFFER_SIZE: 50000
LEARNING_STARTS: 20000
TRAIN_FREQUENCY: 4
GRADIENT_STEPS: 16 #-1 is too unstable, giving the same value as num_envs seems to be stable
TARGET_UPDATE_FREQUENCY: 8000

AUTOTUNE: True
TARGET_ENTROPY_SCALE: 0.89
ALPHA: 0.2

SCAN_STEPS: 1000
NUM_ENVS: 16 #incerasing it speeds up the learning. 16 worked best.
TOTAL_TIMESTEPS: 10000000

# SimBa architecture (Lee et al., ICLR 2025). Actor and critic are asymmetric,
# taken verbatim from the official SimBa SAC release (configs/agent/sac_simba.yaml):
# actor 128 wide / 1 residual block, critic 512 wide / 2 blocks, 4x inverted
# bottleneck. These are the paper's values, NOT independently tuned for discrete
# SAC or for JAXAtari.
# RSNorm is intentionally omitted -- observation preprocessing matches the SAC
# baseline. See the scope note at the top of agents/simba_sac/simba_sac.py.
SIMBA_ACTOR_HIDDEN_DIM: 128
SIMBA_ACTOR_NUM_BLOCKS: 1
SIMBA_CRITIC_HIDDEN_DIM: 512
SIMBA_CRITIC_NUM_BLOCKS: 2
SIMBA_EXPANSION_FACTOR: 4
